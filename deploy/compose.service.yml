# 随口 · 语音聊天（独立容器，零依赖 Node）
# 主站 compose 用 `include`/直接粘贴本段；端口 8795 只在 web 网络内暴露。
# 令牌与密钥写在主站 docker/.env，不进仓库。

voice:
  mem_limit: 192m
  image: ghcr.io/zxlumen/voice-chat:${VOICE_TAG:-latest}
  restart: unless-stopped
  environment:
    PORT: 8795
    # 对话 + 转写走主站 AI 网关（容器内网）
    ZX_AI_GATEWAY_URL: http://app:3000/api/ai/v1
    VOICE_AI_TOKEN: ${VOICE_AI_TOKEN:-}
    # 转写令牌（绑定 SiliconFlow / XingChenASR，快）；缺省复用 AI_TOKEN
    VOICE_ASR_TOKEN: ${VOICE_ASR_TOKEN:-}
    VOICE_ASR_MODEL: ${VOICE_ASR_MODEL:-XingChenAGI/XingChenASR-V3.2}
    VOICE_MODEL: ${VOICE_MODEL:-deepseek-v4.1-flash}
    # TTS：gateway = 主站网关 /audio/speech（推荐，密钥只在主站）/ direct = 直连（本地调试）
    VOICE_TTS_MODE: ${VOICE_TTS_MODE:-gateway}
    VOICE_TTS_TOKEN: ${VOICE_TTS_TOKEN:-}
    VOICE_TTS_MODEL: ${VOICE_TTS_MODEL:-FunAudioLLM/CosyVoice2-0.5B}
    VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-anna}
    # direct 模式才用：
    # VOICE_TTS_BASE_URL: https://api.siliconflow.cn/v1
    # VOICE_TTS_KEY: sk-xxx
  expose:
    - "8795"
  networks:
    - web
